spring:
  datasource:
    url: jdbc:h2:mem:pierre;MODE=MariaDB;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

pierre:
  email:
    enabled: ${EMAIL_ENABLED:true}
    remetente: ${EMAIL_FROM:no-reply@pierre.local}